# ============================================================================
# Docker Compose — Local testing for SN AI Agent
# Usage:
#   1. Copy webapp/.env.example to webapp/.env and fill in your keys
#   2. docker compose up --build
#   3. Open http://localhost:3000
# ============================================================================

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: "SN AI Agent"
        NEXT_PUBLIC_APP_TAGLINE: "Say it. Ship it."
        NEXT_PUBLIC_APP_SUBTITLE: "Spec-driven · Human-approved · AI-powered"
        NEXT_PUBLIC_APP_DESCRIPTION: "AI-powered ServiceNow development"
        NEXT_PUBLIC_APP_LOGO: "/logo-r-v10.svg"
        NEXT_PUBLIC_HERO_TAGLINE: "r Works for You."
        NEXT_PUBLIC_PRIMARY_COLOR: "blue"
        NEXT_PUBLIC_ACCENT_COLOR: "purple"
        NEXT_PUBLIC_SHOW_INFO_BUTTON: "true"
        NEXT_PUBLIC_SHOW_TOOL_DETAILS: "false"
        NEXT_PUBLIC_SHOW_LIVE_STATUS: "true"
        NEXT_PUBLIC_HERO_FEATURE_1: "Describe what you need. We'll build it.|Tell the AI what you want in plain English — forms, automations, workflows, or custom features — and it handles the rest."
        NEXT_PUBLIC_HERO_FEATURE_2: "A guided workflow, not a black box.|Every feature follows a structured path: spec → design → build → test → deploy. You review and approve each step before moving on."
        NEXT_PUBLIC_HERO_FEATURE_3: "You're always in control.|Nothing gets deployed without your sign-off. The AI checks what already exists, reuses what it can, and tracks every change."
        NEXT_PUBLIC_TRUST_ITEM_1: ""
        NEXT_PUBLIC_TRUST_ITEM_2: ""
        NEXT_PUBLIC_TRUST_ITEM_3: ""
        NEXT_PUBLIC_TRUST_ITEM_4: ""
        NEXT_PUBLIC_FEATURES_EYEBROW: ""
        NEXT_PUBLIC_FEATURES_TITLE: ""
        NEXT_PUBLIC_STEPS_EYEBROW: ""
        NEXT_PUBLIC_STEPS_TITLE: ""
        NEXT_PUBLIC_HIGHLIGHT_TITLE: ""
        NEXT_PUBLIC_HIGHLIGHT_DESC: ""
        NEXT_PUBLIC_CTA_HEADLINE: ""
        NEXT_PUBLIC_CTA_SUBTEXT: ""
    ports:
      - "3000:3000"
    env_file:
      - webapp/.env
    environment:
      - NODE_ENV=production
    volumes:
      # Persist logs across container restarts
      - webapp-logs:/app/webapp/logs
    restart: unless-stopped

volumes:
  webapp-logs:


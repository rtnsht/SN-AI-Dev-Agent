# ============================================================================
# Render Blueprint — Auto-configures the app when connected to your repo
# Docs: https://docs.render.com/blueprint-spec
#
# Usage:
#   1. Push this file to your repo
#   2. Go to render.com → New → Blueprint → Connect repo
#   3. Render reads this file and sets up everything
#   4. Fill in env var values in the Render dashboard
# ============================================================================

services:
  - type: web
    name: sn-ai-dev-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # ── Scaling ────────────────────────────────────────────────────
    plan: pro                    # $25/mo per instance
    numInstances: 1              # Start with 1, auto-scale handles the rest
    scaling:
      minInstances: 1
      maxInstances: 5
      targetCPUPercent: 70       # Scale up when avg CPU > 70%
      targetMemoryPercent: 80    # Scale up when avg memory > 80%

    # ── Docker build args ────────────────────────────────────────
    # NEXT_PUBLIC_* vars must be available at build time (Next.js inlines them).
    # These are passed as --build-arg to the Dockerfile.
    dockerBuildArgs:
      NEXT_PUBLIC_APP_NAME: "SN AI Agent"
      NEXT_PUBLIC_APP_TAGLINE: "Say it. Ship it."
      NEXT_PUBLIC_APP_SUBTITLE: "Spec-driven · Human-approved · AI-powered"
      NEXT_PUBLIC_APP_DESCRIPTION: "AI-powered ServiceNow development"
      NEXT_PUBLIC_APP_LOGO: "/logo-r-v10.svg"
      NEXT_PUBLIC_HERO_TAGLINE: "r Works for You."
      NEXT_PUBLIC_PRIMARY_COLOR: "blue"
      NEXT_PUBLIC_ACCENT_COLOR: "purple"
      NEXT_PUBLIC_SHOW_INFO_BUTTON: "true"
      NEXT_PUBLIC_SHOW_TOOL_DETAILS: "false"
      NEXT_PUBLIC_SHOW_LIVE_STATUS: "true"
      NEXT_PUBLIC_HERO_FEATURE_1: "Describe what you need. We'll build it.|Tell the AI what you want in plain English — forms, automations, workflows, or custom features — and it handles the rest."
      NEXT_PUBLIC_HERO_FEATURE_2: "A guided workflow, not a black box.|Every feature follows a structured path: spec → design → build → test → deploy. You review and approve each step before moving on."
      NEXT_PUBLIC_HERO_FEATURE_3: "You're always in control.|Nothing gets deployed without your sign-off. The AI checks what already exists, reuses what it can, and tracks every change."

    # ── Health check ───────────────────────────────────────────────
    healthCheckPath: /api/config

    # ── Persistent disk for logs ───────────────────────────────────
    disk:
      name: webapp-logs
      mountPath: /app/webapp/logs
      sizeGB: 1

    # ── Environment variables ──────────────────────────────────────
    # Values are set in the Render dashboard (never commit secrets)
    envVars:
      # AI Provider Keys (at least one required)
      - key: CLAUDE_API_KEY
        sync: false              # Must be set manually in dashboard
      - key: OPENROUTER_API_KEY
        sync: false

      # ServiceNow Instance (optional — users can enter in UI)
      - key: SN_INSTANCE_URL
        sync: false
      - key: SN_USERNAME
        sync: false
      - key: SN_PASSWORD
        sync: false

      # Rate limiting
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: RATE_LIMIT_WINDOW_HOURS
        value: "1"

      # UI behavior
      - key: ALLOW_USER_API_KEYS
        value: "true"
      - key: NEXT_PUBLIC_SHOW_TOOL_DETAILS
        value: "false"
      - key: NEXT_PUBLIC_SHOW_LIVE_STATUS
        value: "true"

      # Branding
      - key: NEXT_PUBLIC_APP_NAME
        value: "SN AI Agent"
      - key: NEXT_PUBLIC_APP_TAGLINE
        value: "Say it. Ship it."
      - key: NEXT_PUBLIC_APP_SUBTITLE
        value: "Spec-driven · Human-approved · AI-powered"
      - key: NEXT_PUBLIC_PRIMARY_COLOR
        value: "blue"
      - key: NEXT_PUBLIC_ACCENT_COLOR
        value: "purple"
      - key: NEXT_PUBLIC_SHOW_INFO_BUTTON
        value: "true"

      # Node / Next.js
      - key: NODE_ENV
        value: "production"

      # Auth bypass — MUST stay "false" in production
      - key: BYPASS_AUTH
        value: "false"

      # ── Auth Gate (Invite-Only Access) ──────────────────────────
      # Supabase (required for auth gate)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # Admin credentials
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

      # Auth behavior
      - key: APP_URL
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: REQUIRE_ACCESS_APPROVAL
        value: "true"

      # Session
      - key: SESSION_COOKIE_NAME
        value: "sn-ai-session"
      - key: SESSION_MAX_AGE_DAYS
        value: "1"

      # Login rate limiting
      - key: LOGIN_MAX_ATTEMPTS
        value: "3"
      - key: LOGIN_WINDOW_MINUTES
        value: "15"

      # Magic link / email verification
      - key: MAGIC_LINK_EXPIRY_HOURS
        value: "72"
      - key: EMAIL_VERIFY_EXPIRY_HOURS
        value: "24"

      # HMAC secret for email-check hint cookies (anti-enumeration)
      - key: AUTH_HINT_SECRET
        sync: false

      # Email provider (Zeptomail)
      - key: ZEPTOMAIL_API_KEY
        sync: false
      - key: ZEPTOMAIL_API_URL
        value: "https://api.zeptomail.com/v1.1/email"
      - key: ZEPTOMAIL_FROM_EMAIL
        sync: false
      - key: ZEPTOMAIL_FROM_NAME
        sync: false
      - key: ZEPTOMAIL_BOUNCE_ADDRESS
        sync: false

      # ── Log Persistence (Supabase) ────────────────────────────────
      - key: LOG_PERSISTENCE_ENABLED
        value: "true"
      - key: LOG_RETENTION_DAYS
        value: "90"
      - key: LOG_FLUSH_INTERVAL_MS
        value: "30000"

      # ── Log Storage Sync (Object Storage Upload) ──────────────────
      - key: LOG_STORAGE_ENABLED
        value: "false"
      - key: LOG_STORAGE_PROVIDERS
        value: "do-spaces,supabase-s3"
      - key: LOG_STORAGE_METADATA_BACKEND
        value: "supabase"
      - key: LOG_STORAGE_PREFIX
        value: "logs/"
      - key: LOG_STORAGE_INTERVAL_MS
        value: "300000"
      - key: LOG_STORAGE_MAX_RETRIES
        value: "3"
      - key: LOG_STORAGE_MIN_FILE_AGE_MS
        value: "60000"

      # DigitalOcean Spaces (Singapore)
      - key: LOG_STORAGE_DO_SPACES_ENDPOINT
        value: "https://sgp1.digitaloceanspaces.com"
      - key: LOG_STORAGE_DO_SPACES_REGION
        value: "sgp1"
      - key: LOG_STORAGE_DO_SPACES_BUCKET
        sync: false
      - key: LOG_STORAGE_DO_SPACES_ACCESS_KEY
        sync: false
      - key: LOG_STORAGE_DO_SPACES_SECRET_KEY
        sync: false

      # Supabase Storage (S3 mode, Singapore)
      - key: LOG_STORAGE_SUPABASE_S3_ENDPOINT
        sync: false
      - key: LOG_STORAGE_SUPABASE_S3_REGION
        value: "ap-southeast-1"
      - key: LOG_STORAGE_SUPABASE_S3_BUCKET
        value: "logs"
      - key: LOG_STORAGE_SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: LOG_STORAGE_SUPABASE_S3_SECRET_KEY
        sync: false

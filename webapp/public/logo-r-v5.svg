<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- V5: Glassmorphism "r" — frosted glass circle with layered depth -->
  <defs>
    <linearGradient id="g5bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="g5r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="g5glow" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="244" fill="url(#g5bg)"/>
  <!-- Inner glow -->
  <circle cx="256" cy="256" r="244" fill="url(#g5glow)"/>
  <!-- Glass inner circle -->
  <circle cx="256" cy="256" r="190" fill="white" opacity="0.06"/>
  <circle cx="256" cy="256" r="190" stroke="white" stroke-width="1" opacity="0.1" fill="none"/>
  <!-- The "r" -->
  <path d="M200 375 V205 Q200 150 260 138 Q310 128 355 158"
        stroke="url(#g5r)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Sparkle accents -->
  <circle cx="355" cy="158" r="6" fill="#e0e7ff"/>
  <circle cx="320" cy="240" r="3" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="280" cy="300" r="2.5" fill="#a5b4fc" opacity="0.35"/>
  <!-- Top-left highlight arc -->
  <path d="M140 120 A200 200 0 0 1 380 100" stroke="white" stroke-width="1.5" opacity="0.08" fill="none"/>
</svg>


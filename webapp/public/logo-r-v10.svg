<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="orbitalGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background — adapts to any surface -->

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#ringGrad1)" stroke-width="0.75" opacity="0.15"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.06"/>

  <!-- Orbital rings — refined with varying weights and opacities -->
  <ellipse cx="256" cy="256" rx="232" ry="96" stroke="url(#ringGrad1)" stroke-width="1.8" opacity="0.4" fill="none" transform="rotate(-25,256,256)" filter="url(#orbitalGlow)"/>
  <ellipse cx="256" cy="256" rx="232" ry="96" stroke="url(#ringGrad2)" stroke-width="1.8" opacity="0.4" fill="none" transform="rotate(25,256,256)" filter="url(#orbitalGlow)"/>
  <ellipse cx="256" cy="256" rx="228" ry="88" stroke="#c084fc" stroke-width="1.2" opacity="0.18" fill="none" transform="rotate(70,256,256)" filter="url(#orbitalGlow)"/>
  <ellipse cx="256" cy="256" rx="226" ry="80" stroke="#818cf8" stroke-width="0.8" opacity="0.12" fill="none" transform="rotate(-60,256,256)"/>

  <!-- Core nucleus -->
  <circle cx="256" cy="256" r="152" fill="url(#coreGrad)"/>
  <circle cx="256" cy="256" r="152" fill="url(#innerGlow)"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#60a5fa" stroke-width="5" opacity="0.06"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#g10)" stroke-width="2.5" opacity="0.6"/>

  <!-- The "r" letterform — sharper strokes, refined curves -->
  <path d="M222 348 V218 Q222 170 276 156 Q324 146 364 172"
        stroke="url(#g10)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)"/>

  <!-- Orbital accent dots — varied sizes for depth -->
  <circle cx="364" cy="172" r="10" fill="#a78bfa" filter="url(#softGlow)"/>
  <circle cx="364" cy="172" r="5" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="98"  cy="198" r="4.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="98"  cy="198" r="2" fill="#93c5fd" opacity="0.5"/>
  <circle cx="418" cy="318" r="4" fill="#c084fc" opacity="0.7"/>
  <circle cx="148" cy="378" r="3.5" fill="#60a5fa" opacity="0.6"/>
  <circle cx="328" cy="100" r="2.5" fill="#818cf8" opacity="0.4"/>
  <circle cx="178" cy="130" r="2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="390" cy="390" r="2" fill="#60a5fa" opacity="0.25"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- V10: Orbital "r" — letter inside concentric rings, space/tech feel -->
  <defs>
    <linearGradient id="g10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="256" cy="256" r="248" fill="#09090b"/>
  <!-- Orbital rings -->
  <ellipse cx="256" cy="256" rx="230" ry="100" stroke="#60a5fa" stroke-width="1.5" opacity="0.12" fill="none" transform="rotate(-25,256,256)"/>
  <ellipse cx="256" cy="256" rx="230" ry="100" stroke="#a78bfa" stroke-width="1.5" opacity="0.12" fill="none" transform="rotate(25,256,256)"/>
  <ellipse cx="256" cy="256" rx="230" ry="100" stroke="#c084fc" stroke-width="1" opacity="0.08" fill="none" transform="rotate(70,256,256)"/>
  <!-- Core circle -->
  <circle cx="256" cy="256" r="150" fill="#111113"/>
  <circle cx="256" cy="256" r="150" stroke="url(#g10)" stroke-width="2" opacity="0.3" fill="none"/>
  <!-- The "r" -->
  <path d="M220 350 V215 Q220 168 275 155 Q325 145 365 172"
        stroke="url(#g10)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Orbital dots -->
  <circle cx="365" cy="172" r="10" fill="#a78bfa"/>
  <circle cx="100" cy="200" r="4" fill="#60a5fa" opacity="0.6"/>
  <circle cx="420" cy="320" r="3.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="150" cy="380" r="3" fill="#60a5fa" opacity="0.4"/>
</svg>


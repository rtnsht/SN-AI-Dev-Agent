# =============================================================================
# SPEC-DRIVEN DEVELOPMENT CONFIGURATION
# =============================================================================
# This file controls the enforcement behavior of the spec-driven development
# framework. Toggle settings ON/OFF based on your team's process needs.
# =============================================================================

# -----------------------------------------------------------------------------
# PHASE GATE CONTROLS
# -----------------------------------------------------------------------------
# When true, previous phase must be marked complete before next phase can start.
# This ensures proper sequencing: Spec → Design → Implementation → Testing → Deployment

enforce.spec.before.design=true
enforce.design.before.implementation=true
enforce.implementation.before.testing=true
enforce.testing.before.deployment=true

# -----------------------------------------------------------------------------
# SIGN-OFF CONTROLS
# -----------------------------------------------------------------------------
# When true, the phase document must have an approved sign-off before
# the phase is considered complete.

require.signoff.spec=true
require.signoff.design=true
require.signoff.testing=false
require.signoff.deployment=false

# -----------------------------------------------------------------------------
# VALIDATION BEHAVIOR
# -----------------------------------------------------------------------------
# Controls what happens when validation fails
# Options: warn | block
#   - warn: Show violations report, allow operation to continue
#   - block: Show violations report, stop the operation (deployment, etc.)

validation.on.failure=warn

# Always generate violations report regardless of pass/fail
validation.always.show.report=true

# Validate structure when running deployment scripts
validation.on.deploy=true

# Validate structure on git pre-commit (requires git hooks setup)
validation.on.commit=false

# -----------------------------------------------------------------------------
# ATF (AUTOMATED TEST FRAMEWORK) INTEGRATION
# -----------------------------------------------------------------------------
# Enable ServiceNow ATF test creation and execution

atf.enabled=true
atf.auto.create.tests=true
atf.run.before.deployment=true
atf.capture.screenshots=true

# -----------------------------------------------------------------------------
# EVIDENCE & ARTIFACTS
# -----------------------------------------------------------------------------
# Controls for test evidence capture

evidence.capture.screenshots=true
evidence.capture.logs=true
evidence.capture.api.responses=true

# -----------------------------------------------------------------------------
# AUTO-GENERATION
# -----------------------------------------------------------------------------
# Automatically generate/update documents

auto.generate.deployment.doc=true
auto.update.manifest=true
auto.capture.test.results=true

# -----------------------------------------------------------------------------
# INSTANCE CONFIGURATION
# -----------------------------------------------------------------------------
# Default ServiceNow instance for deployments

default.instance=dev300943
default.scope=global

